<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FB Đăng Bài Admin</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1>FB Đăng Bài Admin</h1>
    <p class="note">Chỉ tạo key. Khách tự cài bản FB Dang Bai, mở app, copy mã máy rồi gửi về đây.</p>
  </header>
  <main>
    <section class="panel">
      <label for="name">Tên khách</label>
      <input id="name" placeholder="Ví dụ: Shop Lan">
      <label for="machine">Mã máy của khách</label>
      <input id="machine" placeholder="XXXX-XXXX-XXXX-XXXX" spellcheck="false">
      <div class="row">
        <div>
          <label for="days">Số ngày</label>
          <input id="days" type="number" min="1" max="3650" value="30">
        </div>
        <div>
          <label for="until">Hoặc đến ngày</label>
          <input id="until" type="date">
        </div>
      </div>
      <p class="note">Điền một trong hai. Đến ngày là hết 23:59 giờ Việt Nam ngày đó.</p>
      <button class="primary" id="make" type="button">Tạo key</button>
      <p id="msg"></p>
      <label for="key">Key đưa cho khách</label>
      <textarea id="key" readonly placeholder="Key hiện ở đây"></textarea>
      <button class="ghost" id="copy" type="button">Copy key</button>
    </section>
    <section class="panel">
      <h2>Key đã tạo trên máy này</h2>
      <div id="issued" class="note">Chưa có.</div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
